<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <title>Dojo</title>
  </head>

  <body>
    <div class="d-flex justify-content-center align-items-center vh-100">
      <div class="card p-3" style="width: 24rem; height: 20rem">
        <h1 class="mb-3 d-flex justify-content-center align-items-center">
          Calculadora
        </h1>

        <div class="row g-3">
          <div class="col-6">
            <input
              type="text"
              class="form-control"
              placeholder="Primeira nota"
              id="nota1"
            />
          </div>

          <div class="col-6">
            <input
              type="text"
              class="form-control"
              placeholder="Segunda nota"
              id="nota2"
            />
          </div>

          <div class="col-6">
            <input
              type="text"
              class="form-control"
              placeholder="Terceira nota"
              id="nota3"
            />
          </div>

          <div class="col-6">
            <input 
              type="text" 
              class="form-control" 
              placeholder="Quarta nota"
              id="nota4" 
            />
          </div>
        </div>

        <div class="col-6 mx-auto d-flex flex-column align-items-center">
          <input
            type="text"
            class="form-control mt-4 w-75"
            placeholder="Média Final"
            id="resultado"
            readonly
          />
          <button type="button" class="btn mt-4 btn-primary" id="btnresultado">
            Registrar Resultado
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
